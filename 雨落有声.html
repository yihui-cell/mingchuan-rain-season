<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>雨落有声 · Rain Has a Voice</title>
<style>
/* ==================== 基础 ==================== */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0d14;}
body{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",Georgia,serif;
  color:#e8e4dc;
  user-select:none;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
/* 移动端动态视口高度（防止地址栏导致 100vh 溢出） */
@supports (height:100dvh){
  html,body,#app,#stage{height:100dvh;}
}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}

/* ==================== 舞台 ==================== */
#stage{
  position:relative;width:100%;height:100%;max-width:1400px;overflow:hidden;
  background:#0a0d14;
}
.bg{
  position:absolute;inset:0;
  transition:opacity .9s ease, background 1.2s ease;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 115%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.12) 45%, rgba(0,0,0,0) 70%);
}
.bg.light::after{
  background:radial-gradient(ellipse at 50% 115%, rgba(60,35,10,.35) 0%, rgba(0,0,0,.05) 45%, rgba(0,0,0,0) 70%);
}

/* 左右暗角 */
#stage::before{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(90deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 82%, rgba(0,0,0,.4) 100%);
}

/* ==================== 雨效 ==================== */
#rainLayer,#leafLayer,#lampLayer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
.drop{
  position:absolute;width:1px;height:70px;
  background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(190,215,240,.55));
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-120px) translateX(0);opacity:0;}
  10%{opacity:1;}
  100%{transform:translateY(105vh) translateX(-60px);opacity:.15;}
}
.leaf{
  position:absolute;width:14px;height:10px;
  background:radial-gradient(ellipse at 30% 30%, #e8b556, #b8792a);
  border-radius:60% 10% 60% 10%;
  animation:leafFall linear infinite;
  opacity:.75;
}
@keyframes leafFall{
  0%{transform:translateY(-40px) rotate(0deg) translateX(0);opacity:0;}
  10%{opacity:.8;}
  100%{transform:translateY(105vh) rotate(720deg) translateX(120px);opacity:0;}
}
.lampglow{
  position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,214,140,.30) 0%, rgba(255,200,110,.10) 35%, rgba(255,200,110,0) 70%);
  animation:pulseGlow 5s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{opacity:.65;}50%{opacity:1;}}

/* 场景名牌 */
#sceneTag{
  position:absolute;top:26px;left:34px;z-index:12;
  font-size:13px;letter-spacing:.28em;color:rgba(255,255,255,.62);
  padding:7px 16px;border:1px solid rgba(255,255,255,.20);
  border-radius:2px;background:rgba(10,14,22,.42);
  backdrop-filter:blur(4px);transition:.5s;
}

/* ==================== 立绘 ==================== */
/* 立绘：容器固定高度，图片按 contain 居中贴底，宽度由图片比例决定 */
.sprite{
  position:absolute;bottom:0;height:76%;width:auto;z-index:5;
  background-repeat:no-repeat;background-position:bottom center;background-size:contain;
  transition:opacity .75s ease, transform .75s cubic-bezier(.2,.8,.3,1), filter .6s;
  opacity:0;pointer-events:none;
  filter:drop-shadow(0 8px 30px rgba(0,0,0,.55));
}
/* 用与图片同比例的透明占位元素撑开宽度（background 无法撑开盒模型） */
.sprite::after{content:"";display:block;width:100%;height:100%;}
.sprite.zw::after{aspect-ratio:404/1299;}
.sprite.jy::after{aspect-ratio:496/1526;}
/* 立绘定位 */
.sprite.left{left:6%;}
.sprite.right{right:6%;}
.sprite.on{opacity:1;}
.sprite.dim{filter:brightness(.52) saturate(.7) drop-shadow(0 8px 30px rgba(0,0,0,.6));transform:translateY(14px) scale(.97);}
.sprite.none{opacity:0;}

/* ==================== 对话框 ==================== */
#dialogue{
  position:absolute;left:50%;bottom:calc(3.2% + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);
  width:min(1080px,93%);z-index:20;
  background:linear-gradient(180deg, rgba(13,17,26,.90) 0%, rgba(9,12,19,.95) 100%);
  border:1px solid rgba(255,255,255,.13);
  border-radius:4px;
  padding:30px 42px 34px;
  box-shadow:0 18px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(9px);
  opacity:0;transition:opacity .45s;
}
#dialogue.on{opacity:1;}
#speaker{
  position:absolute;top:-15px;left:38px;
  padding:6px 22px;font-size:15px;letter-spacing:.22em;
  background:linear-gradient(180deg,#2c3d55,#1b2738);
  border:1px solid rgba(255,255,255,.22);
  border-radius:3px;color:#cfe0f2;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
#speaker.hide{display:none;}
#speaker.zhiwei{background:linear-gradient(180deg,#4a3a52,#2c2233);color:#e6cfe8;}
#speaker.jiangyan{background:linear-gradient(180deg,#2a4a44,#182e2b);color:#c8e8dd;}
#text{
  font-size:20px;line-height:2.05;letter-spacing:.045em;
  min-height:84px;color:#e9e5dd;text-shadow:0 1px 3px rgba(0,0,0,.6);
}
#text.narr{color:#c9d4e0;font-style:normal;}
#text.think{color:#b9a8cf;font-style:italic;padding-left:14px;border-left:2px solid rgba(185,168,207,.4);}
#text.sys{color:#8fa8bd;font-size:16px;text-align:center;font-style:normal;letter-spacing:.2em;}
#nextHint{
  position:absolute;right:34px;bottom:14px;font-size:13px;color:rgba(255,255,255,.4);
  animation:blink 1.5s ease-in-out infinite;letter-spacing:.15em;
}
@keyframes blink{0%,100%{opacity:.3;}50%{opacity:.9;}}

/* ==================== 选项 ==================== */
#choices{
  position:absolute;inset:0;z-index:40;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:rgba(6,9,14,.55);backdrop-filter:blur(3px);
  padding:40px;
}
#choices.on{display:flex;}
.choice{
  width:min(760px,88%);padding:20px 30px;
  background:linear-gradient(180deg, rgba(28,36,50,.94), rgba(17,23,33,.96));
  border:1px solid rgba(255,255,255,.16);border-radius:3px;
  font-size:18px;letter-spacing:.05em;color:#dfe6ee;cursor:pointer;
  transition:.28s cubic-bezier(.2,.8,.3,1);
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  animation:choiceIn .45s backwards;
  font-family:inherit;text-align:left;
}
.choice:hover{
  border-color:rgba(160,200,240,.55);
  background:linear-gradient(180deg, rgba(42,56,76,.96), rgba(24,33,47,.98));
  transform:translateX(8px);
  box-shadow:0 8px 32px rgba(0,0,0,.5), inset 3px 0 0 rgba(160,200,240,.7);
  color:#fff;
}
.choice .tip{font-size:13px;color:rgba(255,255,255,.38);letter-spacing:.1em;line-height:1.8;text-align:right;flex-shrink:0;}
.choice:hover .tip{color:rgba(200,225,255,.7);}
@keyframes choiceIn{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}

/* ==================== 顶部状态 ==================== */
#hud{
  position:absolute;top:26px;right:34px;z-index:12;
  display:flex;gap:12px;align-items:center;
}
.hudBtn{
  padding:8px 16px;font-size:13px;letter-spacing:.14em;
  background:rgba(12,17,26,.62);border:1px solid rgba(255,255,255,.20);
  border-radius:2px;color:rgba(255,255,255,.7);cursor:pointer;
  transition:.25s;font-family:inherit;backdrop-filter:blur(4px);
}
.hudBtn:hover{background:rgba(40,55,75,.8);color:#fff;border-color:rgba(255,255,255,.4);}

/* 共鸣条 */
#resonance{
  position:absolute;left:34px;bottom:15.5%;z-index:12;width:190px;
  opacity:0;transition:.6s;
}
#resonance.on{opacity:1;}
#resonance .lbl{font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.45);margin-bottom:7px;}
.bar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-bottom:5px;position:relative;}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width 1.1s cubic-bezier(.2,.8,.3,1);}
.bar.g i{background:linear-gradient(90deg,#4a7fb5,#7db8e8);}
.bar.t i{background:linear-gradient(90deg,#3d8a7a,#7fd8c0);}
.bar.w i{background:linear-gradient(90deg,#9a6ab8,#d8a8e8);}
#moodWord{
  position:absolute;left:34px;bottom:11%;z-index:12;
  font-size:15px;letter-spacing:.34em;color:rgba(255,255,255,.5);
  opacity:0;transition:.8s;
}
#moodWord.on{opacity:1;}

/* ==================== 标题屏 ==================== */
#titleScreen{
  position:absolute;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%, #1e2a3d 0%, #101720 55%, #070a10 100%);
  transition:opacity .8s;
}
#titleScreen.off{opacity:0;pointer-events:none;}
#titleScreen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(90,140,190,.07) 0%, rgba(0,0,0,0) 40%);
}
.tTitle{
  font-size:74px;letter-spacing:.42em;font-weight:400;
  background:linear-gradient(180deg,#eaf2fa,#8fb4d4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 60px rgba(120,180,230,.25);
  margin-bottom:8px;padding-left:.42em;
}
.tSub{
  font-size:14px;letter-spacing:.55em;color:rgba(180,205,230,.55);
  margin-bottom:52px;padding-left:.55em;
}
.tMenu{display:flex;flex-direction:column;gap:14px;z-index:2;}
.tBtn{
  width:290px;padding:15px 0;text-align:center;
  border:1px solid rgba(255,255,255,.22);border-radius:2px;
  font-size:16px;letter-spacing:.3em;color:rgba(228,238,248,.85);
  background:rgba(20,30,44,.5);cursor:pointer;transition:.3s;font-family:inherit;
  backdrop-filter:blur(4px);
}
.tBtn:hover{
  background:rgba(50,78,110,.72);color:#fff;border-color:rgba(170,210,245,.6);
  letter-spacing:.42em;box-shadow:0 0 32px rgba(110,170,225,.28);
}
.tBtn.dim{opacity:.4;}
.tBtn .sm{display:block;font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.35);margin-top:4px;}
.tFoot{
  position:absolute;bottom:30px;font-size:12px;letter-spacing:.22em;
  color:rgba(255,255,255,.28);text-align:center;line-height:2;
}

/* ==================== 结局屏 ==================== */
#endingScreen{
  position:absolute;inset:0;z-index:70;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%, #16202e 0%, #0a0e15 60%, #05070b 100%);
  opacity:0;transition:opacity 1.2s;padding:40px;
}
#endingScreen.on{display:flex;opacity:1;}
.eIcon{font-size:56px;margin-bottom:18px;animation:ePop 1s cubic-bezier(.2,1.4,.4,1);}
@keyframes ePop{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
.eSub{font-size:12px;letter-spacing:.5em;color:rgba(255,255,255,.4);margin-bottom:14px;padding-left:.5em;}
.eTitle{font-size:40px;letter-spacing:.18em;margin-bottom:34px;text-align:center;}
.eSeal{
  max-width:660px;text-align:center;font-size:19px;line-height:2.1;
  letter-spacing:.08em;color:#dfe8f2;padding:26px 32px;
  border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16);
  margin-bottom:40px;font-style:italic;
}
.eBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.eBtn{
  padding:13px 30px;font-size:14px;letter-spacing:.2em;
  border:1px solid rgba(255,255,255,.24);border-radius:2px;
  background:rgba(24,34,48,.6);color:rgba(225,235,245,.85);
  cursor:pointer;transition:.28s;font-family:inherit;
}
.eBtn:hover{background:rgba(52,80,112,.75);color:#fff;border-color:rgba(170,210,245,.6);}

/* ==================== 图鉴 ==================== */
#gallery{
  position:absolute;inset:0;z-index:80;display:none;
  background:radial-gradient(ellipse at 50% 40%, #16202e 0%, #090d14 65%, #05070b 100%);
  padding:56px 60px;overflow-y:auto;
}
#gallery.on{display:block;animation:choiceIn .5s;}
.gTitle{font-size:26px;letter-spacing:.3em;color:#cfe0f2;margin-bottom:8px;}
.gDesc{font-size:13px;letter-spacing:.16em;color:rgba(255,255,255,.4);margin-bottom:34px;}
.gGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
.gCard{
  padding:22px 24px;border-radius:3px;
  background:linear-gradient(180deg, rgba(26,34,48,.92), rgba(15,20,29,.96));
  border:1px solid rgba(255,255,255,.12);transition:.3s;
}
.gCard.unlocked{border-color:rgba(170,210,245,.4);box-shadow:0 6px 28px rgba(60,110,160,.18);}
.gCard .gI{font-size:26px;margin-bottom:10px;}
.gCard .gT{font-size:17px;letter-spacing:.1em;margin-bottom:6px;color:#e2ebf4;}
.gCard .gSub{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.35);margin-bottom:12px;}
.gCard .gSeal{font-size:14px;line-height:1.85;color:#b8c8d8;font-style:italic;}
.gCard.locked{opacity:.5;}
.gCard.locked .gT,.gCard.locked .gI{filter:blur(0);color:rgba(255,255,255,.25);}
.gCard.locked .gSeal{color:rgba(255,255,255,.22);font-style:normal;}
.gClose{
  position:fixed;top:30px;right:52px;z-index:81;
  padding:10px 24px;font-size:14px;letter-spacing:.2em;
  border:1px solid rgba(255,255,255,.24);border-radius:2px;
  background:rgba(24,34,48,.7);color:rgba(225,235,245,.85);
  cursor:pointer;transition:.28s;font-family:inherit;
}
.gClose:hover{background:rgba(52,80,112,.8);color:#fff;}

/* ==================== 彩蛋 CG ==================== */
#cgLayer{
  position:absolute;inset:0;z-index:55;display:none;
  background:#05070b;align-items:center;justify-content:center;
  flex-direction:column;padding:36px;
}
#cgLayer.on{display:flex;animation:cgIn 1.6s ease;}
@keyframes cgIn{from{opacity:0;}to{opacity:1;}}
#cgImg{
  max-width:min(760px,86%);max-height:66vh;object-fit:contain;
  border:1px solid rgba(255,255,255,.18);border-radius:2px;
  box-shadow:0 24px 90px rgba(0,0,0,.85);
  animation:cgZoom 12s ease-out forwards;
}
@keyframes cgZoom{from{transform:scale(1.06);}to{transform:scale(1);}}
#cgCap{
  margin-top:26px;font-size:15px;letter-spacing:.22em;color:rgba(220,232,245,.75);
  text-align:center;line-height:2;
}
#cgClose{
  margin-top:26px;padding:12px 34px;font-size:14px;letter-spacing:.24em;
  border:1px solid rgba(255,255,255,.26);border-radius:2px;
  background:rgba(24,34,48,.7);color:#dfe8f2;cursor:pointer;transition:.28s;font-family:inherit;
}
#cgClose:hover{background:rgba(52,80,112,.8);color:#fff;}

/* ==================== 转场 ==================== */
#flashWhite{
  position:absolute;inset:0;z-index:90;background:#fff;
  opacity:0;pointer-events:none;transition:opacity .35s;
}
#flashWhite.on{opacity:.85;}
.shake{animation:shakeIt .5s;}
@keyframes shakeIt{0%,100%{transform:translate(0,0);}20%{transform:translate(-7px,4px);}40%{transform:translate(7px,-4px);}60%{transform:translate(-5px,-3px);}80%{transform:translate(5px,3px);}}

/* 章节标题卡 */
#chapterCard{
  position:absolute;inset:0;z-index:88;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:rgba(6,9,14,.88);backdrop-filter:blur(6px);
}
#chapterCard.on{display:flex;animation:ccIn .7s ease;}
@keyframes ccIn{from{opacity:0;}to{opacity:1;}}
#chapterCard .ccNum{font-size:13px;letter-spacing:.6em;color:rgba(180,205,230,.5);margin-bottom:18px;padding-left:.6em;}
#chapterCard .ccTitle{font-size:38px;letter-spacing:.24em;color:#e4edf6;text-align:center;}
#chapterCard .ccLine{width:120px;height:1px;background:linear-gradient(90deg,transparent,rgba(180,205,230,.7),transparent);margin-top:26px;}

/* ==================== 序章引导 ==================== */
#renameBox{
  position:absolute;inset:0;z-index:85;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:rgba(6,9,14,.9);backdrop-filter:blur(6px);
}
#renameBox.on{display:flex;}
#renameBox label{font-size:14px;letter-spacing:.3em;color:rgba(200,220,240,.6);margin-bottom:18px;}
#renameBox input{
  width:280px;padding:14px;text-align:center;font-size:20px;letter-spacing:.2em;
  background:rgba(20,28,40,.8);border:1px solid rgba(255,255,255,.25);
  color:#e8eef6;border-radius:2px;font-family:inherit;outline:none;
}
#renameBox input:focus{border-color:rgba(160,200,240,.7);}
#renameBox button{
  margin-top:24px;padding:12px 40px;font-size:15px;letter-spacing:.26em;
  background:rgba(40,62,88,.8);border:1px solid rgba(170,210,245,.45);
  color:#e2ebf4;border-radius:2px;cursor:pointer;transition:.28s;font-family:inherit;
}
#renameBox button:hover{background:rgba(60,90,124,.9);color:#fff;}

/* 结局解锁提示 */
#toast{
  position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-30px);
  z-index:95;padding:12px 28px;font-size:14px;letter-spacing:.2em;
  background:linear-gradient(180deg, rgba(60,90,124,.95), rgba(30,46,66,.96));
  border:1px solid rgba(170,210,245,.45);border-radius:2px;color:#eaf2fa;
  opacity:0;transition:.6s;white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* 跳过/自动 状态 */
.hudBtn.active{background:rgba(70,110,150,.85);color:#fff;border-color:rgba(190,225,255,.7);}

/* ==================== 移动端适配 ==================== */
@media (max-width:820px){
  #titleScreen{padding:0 20px;}
  /* 用 margin-right 抵消最后一个字后的字距，避免整体右偏 */
  .tTitle{font-size:12.5vw;letter-spacing:.1em;padding-left:0;margin-right:-.1em;text-align:center;line-height:1.25;}
  .tSub{font-size:10px;letter-spacing:.28em;padding-left:0;margin-right:-.28em;margin-bottom:7vh;text-align:center;}
  .tMenu{gap:12px;align-items:center;}
  .tBtn{width:min(78vw,320px);padding:14px 0;font-size:15px;letter-spacing:.16em;margin-right:-.16em;}
  .tFoot{font-size:10px;letter-spacing:.05em;bottom:16px;padding:0 16px;line-height:1.9;}

  #sceneTag{top:calc(12px + env(safe-area-inset-top, 0px));left:12px;font-size:11px;letter-spacing:.2em;padding:5px 10px;}

  #hud{top:calc(12px + env(safe-area-inset-top, 0px));right:12px;gap:6px;}
  .hudBtn{padding:7px 10px;font-size:11px;letter-spacing:.06em;}

  /* 立绘：手机竖屏下缩小并贴向两侧；z-index 低于对话框，自然压在框后 */
  .sprite{height:54%;}
  .sprite.left{left:-7%;}
  .sprite.right{right:-7%;}
  .sprite.dim{transform:translateY(8px) scale(.98);}

  /* 对话框：留出安全区，字号减小 */
  #dialogue{padding:20px 18px 30px;padding-top:22px;bottom:calc(12px + env(safe-area-inset-bottom, 0px));width:94%;}
  #dialogue.on{bottom:calc(12px + env(safe-area-inset-bottom, 0px));}
  #speaker{left:14px;font-size:12px;padding:5px 13px;letter-spacing:.14em;top:-12px;}
  #text{font-size:15px;line-height:1.85;min-height:64px;letter-spacing:.02em;}
  #text.sys{font-size:13px;letter-spacing:.14em;}
  #nextHint{right:14px;bottom:9px;font-size:11px;}

  /* 共鸣条：移到顶部横条，避免和对话框/立绘挤在左下 */
  #resonance{
    left:12px;right:auto;bottom:auto;top:calc(52px + env(safe-area-inset-top, 0px));width:110px;
  }
  #resonance .lbl{font-size:9px;letter-spacing:.2em;margin-bottom:5px;}
  #moodWord{
    left:auto;right:12px;bottom:auto;top:calc(52px + env(safe-area-inset-top, 0px));
    font-size:12px;letter-spacing:.22em;
  }

  /* 选项：全宽、大点击区、去掉 hover 位移 */
  #choices{padding:16px;gap:11px;justify-content:flex-end;padding-bottom:18vh;}
  .choice{
    width:100%;padding:15px 16px;font-size:15px;letter-spacing:.03em;
    flex-direction:column;align-items:flex-start;gap:5px;
  }
  .choice:hover,.choice:active{transform:none;border-color:rgba(160,200,240,.55);}
  .choice .tip{text-align:left;font-size:11px;}

  /* 章节卡 */
  #chapterCard{padding:0 20px;}
  #chapterCard .ccNum{font-size:11px;letter-spacing:.4em;padding-left:.4em;}
  #chapterCard .ccTitle{font-size:7vw;letter-spacing:.14em;}
  #chapterCard .ccLine{width:80px;margin-top:18px;}

  /* 结局屏 */
  #endingScreen{padding:24px 20px;justify-content:center;}
  .eIcon{font-size:44px;margin-bottom:12px;}
  .eSub{font-size:10px;letter-spacing:.34em;padding-left:.34em;}
  .eTitle{font-size:6.4vw;letter-spacing:.06em;margin-bottom:22px;line-height:1.4;}
  .eSeal{font-size:15px;line-height:1.95;padding:18px 8px;margin-bottom:26px;max-width:100%;}
  .eBtns{gap:10px;width:100%;}
  .eBtn{flex:1;min-width:96px;padding:13px 10px;font-size:13px;letter-spacing:.1em;}

  /* 图鉴：单列 */
  #gallery{padding:70px 16px 30px;}
  .gTitle{font-size:20px;letter-spacing:.2em;}
  .gDesc{font-size:12px;letter-spacing:.08em;margin-bottom:20px;}
  .gGrid{grid-template-columns:1fr;gap:12px;}
  .gCard{padding:16px 18px;}
  .gCard .gT{font-size:15px;}
  .gCard .gSeal{font-size:13px;line-height:1.75;}
  .gClose{top:18px;right:16px;padding:9px 18px;font-size:13px;}

  /* 彩蛋 CG */
  #cgLayer{padding:20px 14px;overflow-y:auto;}
  #cgImg{max-width:100%;max-height:52vh;margin-bottom:4px;}
  #cgCap{font-size:12px;letter-spacing:.12em;margin-top:12px;line-height:1.8;}
  #cgClose{margin-top:14px;padding:11px 28px;font-size:13px;}

  /* 命名框 */
  #renameBox{padding:0 24px;}
  #renameBox input{width:76vw;max-width:300px;font-size:18px;}
  #renameBox button{padding:13px 34px;font-size:14px;}

  #toast{top:56px;font-size:12px;letter-spacing:.1em;padding:9px 18px;max-width:92vw;white-space:normal;text-align:center;}
}

/* 超窄屏（iPhone SE / 旧安卓）进一步压缩 */
@media (max-width:390px){
  #text{font-size:14px;}
  .sprite{height:50%;}
  .tTitle{font-size:14vw;}
  #dialogue{padding:18px 14px 26px;padding-top:20px;}
  .eTitle{font-size:6vw;}
  .eSeal{font-size:13.5px;}
}

/* 横屏手机：立绘和对话框左右分置 */
@media (max-height:480px) and (orientation:landscape){
  .sprite{height:88%;}
  .sprite.left{left:2%;}
  .sprite.right{right:2%;}
  #dialogue{bottom:10px;padding:16px 22px 22px;padding-top:18px;}
  #text{font-size:14px;line-height:1.7;min-height:52px;}
  #resonance{top:auto;bottom:auto;top:48px;left:12px;width:100px;}
  #moodWord{top:48px;}
  #choices{justify-content:center;padding-bottom:16px;}
  .choice{padding:12px 16px;font-size:14px;}
}
</style>

<body>

      校园青涩 · 暗恋拉扯 · 1 主结局 + 5 隐藏结局<br>

<script src="design/story_data.js"></script>
<script>
/* ============================================================
   游戏引擎
   ============================================================ */
const $ = id => document.getElementById(id);
const stage = $("stage");

/* ---------- 状态 ---------- */
let S = {
  G: 0, T: 0, W: 0,
  flags: {},
  chapterIdx: 0,
  nodeIdx: 0,
  queue: [],          // 当前待播放节点队列
  mode: "idle",       // playing | choice | ending | wait | idle
  auto: false,
  skip: false,
  heroine: "沈知微",
  autoTimer: null,
  started: false,
  endingPending: null,
  cgShown: false
};

/* ---------- 存档 ---------- */
const SAVE_KEY = "rainvoice_save_v1";
const GAL_KEY  = "rainvoice_gallery_v1";

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      G:S.G, T:S.T, W:S.W, flags:S.flags,
      chapterIdx:S.chapterIdx, nodeIdx:S.nodeIdx,
      heroine:S.heroine, ts:Date.now()
    }));
  }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function hasSave(){ return !!loadGame(); }
function clearSave(){ try{localStorage.removeItem(SAVE_KEY);}catch(e){} }

function getGallery(){
  try{ return JSON.parse(localStorage.getItem(GAL_KEY) || "{}"); }catch(e){ return {}; }
}
function unlockGallery(id){
  const g = getGallery();
  if(!g[id]){
    g[id] = Date.now();
    try{localStorage.setItem(GAL_KEY, JSON.stringify(g));}catch(e){}
    toast("解锁新结局：「" + ENDINGS[id].title + "」");
  }
  renderGalleryNums();
}
function renderGalleryNums(){
  const g = getGallery();
  const n = Object.keys(g).length;
  $("galNum").textContent = n;
  const el = $("tGalNum"); if(el) el.textContent = n;
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("on"), 2800);
}

/* ---------- 背景 ---------- */
let rainTimer = null, leafTimer = null;
function setScene(key){
  const sc = SCENES[key]; if(!sc) return;
  const bg = $("bg");
  bg.style.background = sc.css;
  bg.classList.toggle("light", !!sc.light);
  $("sceneTag").textContent = sc.name;

  // 清理旧的粒子
  $("rainLayer").innerHTML = "";
  $("leafLayer").innerHTML = "";
  clearInterval(rainTimer); clearInterval(leafTimer);

  if(sc.motif === "rain"){
    rainTimer = setInterval(()=>{
      if($("rainLayer").childElementCount > 70) return;
      const d = document.createElement("div");
      d.className = "drop";
      d.style.left = Math.random()*110 + "%";
      d.style.height = (40 + Math.random()*80) + "px";
      d.style.animationDuration = (0.7 + Math.random()*0.9) + "s";
      d.style.opacity = (0.25 + Math.random()*0.5);
      $("rainLayer").appendChild(d);
      setTimeout(()=>d.remove(), 1900);
    }, 55);
  }
  if(sc.motif === "rain"){
    const gl = document.createElement("div");
    gl.className = "lampglow";
    gl.style.left = "12%"; gl.style.top = "-90px";
    $("lampLayer").appendChild(gl);
  }
  if(sc.motif === "lamp"){
    ["10%","72%"].forEach((l,i)=>{
      const gl = document.createElement("div");
      gl.className = "lampglow";
      gl.style.left = l; gl.style.top = "-110px";
      gl.style.animationDelay = (i*1.2)+"s";
      $("lampLayer").appendChild(gl);
    });
  }
  if(sc.motif === "leaves"){
    leafTimer = setInterval(()=>{
      if($("leafLayer").childElementCount > 26) return;
      const L = document.createElement("div");
      L.className = "leaf";
      L.style.left = (Math.random()*105-5) + "%";
      L.style.animationDuration = (5 + Math.random()*5) + "s";
      L.style.transform = "scale(" + (0.6+Math.random()*0.9) + ")";
      $("leafLayer").appendChild(L);
      setTimeout(()=>L.remove(), 10500);
    }, 420);
  }
}

/* ---------- 立绘 ---------- */
const SPRITE_URLS = {
  zhiwei: "assets/zhiwei.png",
  jiangyan: "assets/jiangyan.png"
};
/* 彩蛋全屏 CG 资源 */
const SPRITE_CG = {
  bonus: "assets/bonus_rain_court.jpg"
};
/* 立绘显示模式：
   absolute=true  —— 章节开场，按 which 完全决定谁在场（会清空另一方）
   absolute=false —— 章内 {t:"show"} 指令，语义是「谁上场/谁退场」，只会往场上加人，
                     不会把本来在场的人顶掉（例如女主先在场，他跑过来 → 两人同框）
   目前引擎只会用 absolute=false 的增量语义处理 {t:"show"} 节点。
   兼容：which 为 "jiangyan"/"zhiwei"/"both"/"none" 及旧的 *_dim 写法。 */
function setSprites(which, absolute){
  const zw = $("spZW"), jy = $("spJY");
  zw.style.backgroundImage = "url('" + SPRITE_URLS.zhiwei + "')";
  jy.style.backgroundImage = "url('" + SPRITE_URLS.jiangyan + "')";

  // 先解析出「这一条指令想让谁在场」
  let wantZW = null, wantJY = null;      // null=不变，true=显示，false=隐藏
  if(which === "zhiwei"){ wantZW = true; wantJY = absolute ? false : null; }
  else if(which === "jiangyan"){ wantJY = true; wantZW = absolute ? false : null; }
  else if(which === "both"){ wantZW = true; wantJY = true; }
  else if(which === "none"){ wantZW = false; wantJY = false; }
  else if(which === "zhiwei_dim"){ wantZW = true; wantJY = absolute ? false : null; }
  else if(which === "jiangyan_dim"){ wantJY = true; wantZW = absolute ? false : null; }
  else { wantZW = false; wantJY = false; }   // 未知值：清场

  const zwOn = wantZW === null ? zw.classList.contains("on") : wantZW;
  const jyOn = wantJY === null ? jy.classList.contains("on") : wantJY;

  zw.className = "sprite zw left" + (zwOn ? " on" : "");
  jy.className = "sprite jy right" + (jyOn ? " on" : "");
}

/* 说话时高亮/压暗 */
function highlightSpeaker(who){
  const zw = $("spZW"), jy = $("spJY");
  const zwOn = zw.classList.contains("on");
  const jyOn = jy.classList.contains("on");
  if(!zwOn && !jyOn) return;
  zw.classList.remove("dim"); jy.classList.remove("dim");
  if(who === S.heroine){
    if(jyOn) jy.classList.add("dim");
  }else if(who === "江砚"){
    if(zwOn) zw.classList.add("dim");
  }
}

/* ---------- 数值条 ---------- */
const MOOD_WORDS = [
  {v:0,  w:"疏 离"},
  {v:18, w:"试 探"},
  {v:36, w:"松 动"},
  {v:56, w:"靠 近"},
  {v:78, w:"决 堤"}
];
function updateHUD(animate){
  $("barG").style.width = Math.min(100, S.G) + "%";
  $("barT").style.width = Math.min(100, S.T) + "%";
  $("barW").style.width = Math.min(100, S.W) + "%";
  let word = MOOD_WORDS[0].w;
  for(const m of MOOD_WORDS) if(S.W >= m.v) word = m.w;
  const mw = $("moodWord");
  if(mw.textContent !== word){
    mw.textContent = word;
    mw.classList.add("on");
    mw.style.opacity = 0;
    setTimeout(()=>mw.style.opacity = 1, 120);
  }
}

/* ---------- 打字机 ---------- */
let typeTimer = null, typing = false, fullText = "";
function typeText(str, cls, cb){
  const el = $("text");
  el.className = cls || "";
  fullText = str;
  el.textContent = "";
  typing = true;
  let i = 0;
  $("nextHint").style.opacity = 0;
  clearInterval(typeTimer);
  const speed = S.skip ? 8 : 26;
  typeTimer = setInterval(()=>{
    if(i >= str.length){
      clearInterval(typeTimer); typing = false;
      $("nextHint").style.opacity = 1;
      if(cb) cb();
      return;
    }
    el.textContent += str[i++];
  }, speed);
}
function finishTyping(){
  clearInterval(typeTimer);
  $("text").textContent = fullText;
  typing = false;
  $("nextHint").style.opacity = 1;
}

let currentSceneKey = "campus_road";

/* ============================================================
   核心状态机
   mode: "playing"(播正文) | "choice"(等选择) | "ending"(播结局)
   ============================================================ */
S.mode = "idle";

/* ---------- 播放一个节点 ---------- */
function playNode(node){
  if(!node) return;

  // 无文本的指令节点：执行后立刻推进下一个
  if(node.t === "show"){ setSprites(node.char); return void advance(); }
  if(node.t === "eff"){
    if(node.s === "flash") flash();
    if(node.s === "shake"){
      stage.classList.add("shake");
      setTimeout(()=>stage.classList.remove("shake"), 520);
    }
    return void advance();
  }
  if(node.t === "cg"){ return void showCG(node.s); }

  // 有文本的节点
  $("dialogue").classList.add("on");
  const spk = $("speaker");

  if(node.t === "nar" || node.t === "think" || node.t === "sys"){
    spk.className = "hide";
    typeText(node.s, node.t === "nar" ? "narr" : node.t);
  }else if(node.t === "say"){
    const isZW = node.who === "沈知微";
    spk.className = isZW ? "zhiwei" : "jiangyan";
    spk.textContent = isZW ? S.heroine : node.who;
    highlightSpeaker(node.who);
    typeText(node.s, "say");
  }
}

/* ---------- 唯一推进入口 ---------- */
function advance(){
  if(S.mode === "choice") return;                  // 等选择，不推进
  if(typing){ finishTyping(); return; }            // 先补完打字
  if($("endingScreen").classList.contains("on")) return;
  if($("cgLayer").classList.contains("on")) return;

  // 队列还有 → 继续播
  if(S.queue.length > 0){
    const node = S.queue.shift();
    if(node && node.__chapterEnd){ onChapterEnd(); return; }   // 本章分支播完
    playNode(node);
    return;
  }

  // 队列空了
  if(S.mode === "ending"){                          // 结局正文播完
    S.mode = "idle";
    // 彩蛋结局：正文收尾后先弹全屏 CG（雨中打球那张），看完再进结局屏
    if(S.endingPending && S.endingPending.cg && !S.cgShown){
      S.cgShown = true;
      showCG("bonus");
      return;
    }
    showEndingScreen(S.endingPending);
    return;
  }
  if(S.mode === "playing"){
    const ch = CHAPTERS[S.chapterIdx];
    if(ch.choices && ch.choices.length){
      showChoices(ch.choices);                     // 进入选项
    }else{
      onChapterEnd();                              // 序章 / 第十章
    }
  }
}

/* ---------- 章节流程 ---------- */
function startChapter(idx){
  S.chapterIdx = idx;
  S.mode = "playing";
  const ch = CHAPTERS[idx];
  currentSceneKey = ch.scene;
  setScene(ch.scene);
  setSprites(ch.show || "none", true);   // 章节开场：完全按 show 决定谁在场

  showChapterCard(ch, ()=>{
    S.queue = ch.script.slice();
    $("dialogue").classList.remove("on");
    $("resonance").classList.add("on");
    updateHUD();
    advance();
  });
}

function showChapterCard(ch, cb){
  const cc = $("chapterCard");
  cc.querySelector(".ccNum").textContent = ch.id === 0 ? "PROLOGUE" : "CHAPTER " + ch.id;
  cc.querySelector(".ccTitle").textContent = ch.title;
  cc.classList.add("on");
  setTimeout(()=>{
    cc.classList.remove("on");
    if(cb) cb();
  }, ch.id === 0 ? 2600 : 1900);
}

/* 章节正文播完后的收尾 */
function onChapterEnd(){
  // 「体贴但保持距离」判定：他足够懂她(T高)，但两人始终没跨出那一步(G低)
  if(S.chapterIdx === 9) S.flags.distant_kind = (S.T >= 50 && S.G <= 68);
  saveGame();

  if(S.chapterIdx < CHAPTERS.length - 1){
    S.mode = "wait";
    setTimeout(()=> startChapter(S.chapterIdx + 1), 850);
  }else{
    resolveEnding();
  }
}

function showChoices(list){
  S.mode = "choice";
  const box = $("choices");
  box.innerHTML = "";
  list.forEach((c, i)=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.style.animationDelay = (i*0.09) + "s";
    b.innerHTML = "<span>" + c.s + "</span>" + (c.tip ? "<span class='tip'>" + c.tip + "</span>" : "");
    b.onclick = ()=> pickChoice(c);
    box.appendChild(b);
  });
  box.classList.add("on");
}

function pickChoice(c){
  $("choices").classList.remove("on");
  $("choices").innerHTML = "";

  if(c.eff){
    S.G = Math.max(0, Math.min(100, S.G + (c.eff.G||0)));
    S.T = Math.max(0, Math.min(100, S.T + (c.eff.T||0)));
    S.W = Math.max(0, Math.min(100, S.W + (c.eff.W||0)));
  }
  if(c.flag) S.flags[c.flag] = true;

  updateHUD();
  saveGame();

  // 播放 then 分支正文，播完后再收尾本章
  S.mode = "playing";
  const thenNodes = (c.then || []).slice();
  if(thenNodes.length){
    S.queue = thenNodes.concat([{ __chapterEnd: true }]);
    advance();
  }else{
    onChapterEnd();
  }
}

/* ---------- 结局判定 ----------
   farewell/leaves/just_rain 是特化条件，优先；
   echo/bonus 是主结局路上的分支；
   main 需要最温暖的一路；midway 兜底（不温不火的中庸路线）。 */
const PRIORITY = ["farewell","leaves","just_rain","echo","bonus","main","midway"];
function resolveEnding(){
  let chosen = null;
  // 按优先级找第一个满足条件的
  for(const id of PRIORITY){
    const e = ENDINGS[id];
    if(e.cond && e.cond(S, S.flags)){ chosen = e; break; }
  }
  // 兜底：理论上不会走到这里（midway 恒成立），保险起见用主结局
  if(!chosen) chosen = ENDINGS.main;

  S.endingPending = chosen;
  unlockGallery(chosen.id);
  clearSave();

  // 播放结局正文
  S.mode = "ending";
  S.queue = chosen.text.slice();
  S.cgShown = false;                 // 彩蛋 CG 是否已播（在正文收尾时触发）
  $("dialogue").classList.add("on");
  $("resonance").classList.remove("on");
  $("moodWord").classList.remove("on");
  currentSceneKey = "old_court";
  setScene("old_court");
  setSprites("none");
  setTimeout(()=> advance(), 700);
}

/* ---------- 结局屏 ---------- */
function showEndingScreen(e){
  const es = $("endingScreen");
  $("eIcon").textContent = e.icon;
  $("eSub").textContent = e.sub;
  $("eTitle").textContent = e.title;
  $("eTitle").style.color = e.color;
  $("eSeal").textContent = "「" + e.seal + "」";
  es.classList.add("on");
}

/* ---------- 彩蛋 CG ---------- */
let cgReturn = null;      // 关闭 CG 后要执行的动作
function showCG(kind){
  const layer = $("cgLayer");
  if(kind === "bonus"){
    $("cgImg").src = SPRITE_CG.bonus;
    $("cgCap").innerHTML = "那年雨中 · 西门旧球场<br><span style='font-size:13px;color:rgba(200,215,230,.5)'>「这张照片，是他拍的。」</span>";
    layer.classList.add("on");
    const closeCG = ()=>{
      layer.classList.remove("on");
      const fn = cgReturn; cgReturn = null;
      if(fn) fn(); else advance();
    };
    cgReturn = ()=>{
      // 看完彩蛋 CG → 进入结局屏
      if(S.endingPending){ S.mode = "idle"; showEndingScreen(S.endingPending); }
      else advance();
    };
    $("cgClose").onclick = closeCG;
    $("cgLayer").onclick = (e)=>{ if(e.target === layer) closeCG(); };
  }else{
    advance();
  }
}

/* ---------- 闪白 ---------- */
function flash(){
  const f = $("flashWhite");
  f.classList.add("on");
  setTimeout(()=>f.classList.remove("on"), 180);
}

/* ---------- 输入：点击/触摸/空格推进 ---------- */
/* 用统一的 pointerup 处理鼠标与触摸，避免移动端 click 延迟与重复触发 */
let _lastTap = 0;
function handleAdvanceTap(ev){
  // 忽略落在交互控件上的点击
  if(ev.target.closest("#choices") || ev.target.closest("#hud") ||
     ev.target.closest("#gallery") || ev.target.closest("#endingScreen") ||
     ev.target.closest("#cgLayer") || ev.target.closest("#titleScreen") ||
     ev.target.closest("#renameBox") || ev.target.closest(".hudBtn") ||
     ev.target.closest(".tBtn") || ev.target.closest(".eBtn") ||
     ev.target.closest(".gClose") || ev.target.closest("#cgClose") ||
     ev.target.closest("input")) return;
  // 防止同一帧内重复推进
  const now = Date.now();
  if(now - _lastTap < 60) return;
  _lastTap = now;
  advance();
}
/* 整个舞台统一绑定；对话框也包含在内 */
stage.addEventListener("pointerup", handleAdvanceTap);
/*
 * 注意：这里**不要**用 touchend + preventDefault 去防双击缩放。
 * 原因：pointerup 会先触发并刷新 _lastTap，紧随其后的 touchend 里
 * now-_lastTap 只有几毫秒，永远 < 阈值 —— 结果每一次触摸都会被
 * preventDefault() 掉，导致所有依赖合成 click 的按钮（选项/开始/图鉴…）
 * 在手机上完全点不动。
 * 防缩放已经由 CSS 的 touch-action:manipulation + viewport 的
 * user-scalable=no / maximum-scale=1 负责，无需 JS 再拦。
 */
/* 阻止长按选中/右键菜单，保持游戏手感 */
stage.addEventListener("contextmenu", e=>e.preventDefault());

document.addEventListener("keydown", e=>{
  // 正在输入名字时，把键盘让给输入框（否则空格会被 preventDefault 吞掉）
  if(e.target && e.target.tagName === "INPUT") return;
  if(e.code === "Space" || e.code === "Enter"){
    e.preventDefault();
    if($("titleScreen").classList.contains("off") &&
       !$("renameBox").classList.contains("on") &&
       !$("cgLayer").classList.contains("on") &&
       !$("choices").classList.contains("on") &&
       !$("endingScreen").classList.contains("on")) advance();
  }
});

/* ---------- 标题 / 开始 ---------- */
function toTitle(){
  stopAutoSkip();
  $("titleScreen").classList.remove("off");
  $("endingScreen").classList.remove("on");
  $("gallery").classList.remove("on");
  $("cgLayer").classList.remove("on");
  $("dialogue").classList.remove("on");
  $("resonance").classList.remove("on");
  $("choices").classList.remove("on");
  $("tContinue").classList.toggle("dim", !hasSave());
  renderGalleryNums();
  setSprites("none");
}
function newGame(){
  stopAutoSkip();                     // 清掉上一局残留的自动/快进定时器
  S = { G:0,T:0,W:0, flags:{}, chapterIdx:0, nodeIdx:0, queue:[], mode:"idle",
        auto:false, skip:false, heroine:"沈知微", autoTimer:null, started:true,
        endingPending:null, cgShown:false };
  currentSceneKey = CHAPTERS[0].scene;
  setScene(CHAPTERS[0].scene);
  setSprites("none");
  $("dialogue").classList.remove("on");
  $("titleScreen").classList.add("off");
  $("endingScreen").classList.remove("on");
  $("gallery").classList.remove("on");
  $("renameBox").classList.add("on");
  $("nameInput").value = "沈知微";
  // 移动端：刚从 display:none 切换过来时同步 focus 不会唤出键盘。
  // 这里不用自动 focus/select —— 让用户自己点输入框（更稳，也不会被浏览器拦截）。
  // 桌面端保留便捷的自动选中。
  if(!isTouchDevice()){
    setTimeout(()=>{ try{ $("nameInput").focus(); $("nameInput").select(); }catch(e){} }, 60);
  }
}
function isTouchDevice(){
  return ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
}
function beginAfterRename(){
  const v = ($("nameInput").value || "").trim() || "沈知微";
  S.heroine = v;
  $("renameBox").classList.remove("on");
  saveGame();
  startChapter(0);
}
function continueGame(){
  stopAutoSkip();
  const s = loadGame();
  if(!s){ toast("没有找到存档"); return; }
  S.G=s.G; S.T=s.T; S.W=s.W; S.flags=s.flags||{};
  S.chapterIdx=s.chapterIdx; S.heroine=s.heroine||"沈知微";
  S.endingPending=null; S.mode="idle"; S.queue=[];
  $("titleScreen").classList.add("off");
  $("endingScreen").classList.remove("on");
  // 从该章节开头重新播放（简化存档：章节级）
  startChapter(S.chapterIdx);
}

$("tStart").onclick = newGame;
$("tContinue").onclick = continueGame;
$("nameConfirm").onclick = beginAfterRename;
$("nameInput").onkeydown = e=>{ if(e.key === "Enter") beginAfterRename(); };

$("btnGallery").onclick = ()=>openGallery();
$("tGallery").onclick = ()=>openGallery();
$("eGalleryBtn").onclick = ()=>openGallery();
$("galClose").onclick = ()=>{ $("gallery").classList.remove("on"); };
$("btnTitle").onclick = ()=>toTitle();
$("eTitleBtn").onclick = ()=>toTitle();
$("eAgain").onclick = ()=>{ $("endingScreen").classList.remove("on"); newGame(); };

$("btnAuto").onclick = function(){
  // 结局屏/图鉴里点自动没意义，且会把上个循环留着
  if($("endingScreen").classList.contains("on") || $("gallery").classList.contains("on")) return;
  S.auto = !S.auto; this.classList.toggle("active", S.auto);
  if(S.auto) autoLoop(); else clearInterval(autoTimer2);
};
$("btnSkip").onclick = function(){
  if($("endingScreen").classList.contains("on") || $("gallery").classList.contains("on")) return;
  S.skip = !S.skip; this.classList.toggle("active", S.skip);
  if(S.skip) skipLoop(); else clearInterval(skipTimer);
};
let autoTimer2=null, skipTimer=null;
/* 停掉所有自动/快进循环并复位按钮状态（换局、回标题、读档时都要调用） */
function stopAutoSkip(){
  clearInterval(autoTimer2); autoTimer2 = null;
  clearInterval(skipTimer);  skipTimer  = null;
  if(typeof S !== "undefined" && S){ S.auto = false; S.skip = false; }
  const ba = $("btnAuto"), bs = $("btnSkip");
  if(ba) ba.classList.remove("active");
  if(bs) bs.classList.remove("active");
}
function autoLoop(){
  clearInterval(autoTimer2);
  if(!S.auto) return;
  autoTimer2 = setInterval(()=>{
    if(S.mode !== "playing" && S.mode !== "ending") return;
    if($("choices").classList.contains("on")) return;
    if($("endingScreen").classList.contains("on")) return;
    if($("gallery").classList.contains("on")) return;   // 看结局图鉴时暂停
    if(typing) return;
    advance();
  }, 1400);
}
function skipLoop(){
  clearInterval(skipTimer);
  if(!S.skip) return;
  skipTimer = setInterval(()=>{
    if(S.mode === "choice"){
      S.skip = false; $("btnSkip").classList.remove("active");
      clearInterval(skipTimer); return;
    }
    if($("endingScreen").classList.contains("on")){ clearInterval(skipTimer); return; }
    if($("gallery").classList.contains("on")) return;   // 看结局图鉴时暂停
    if($("cgLayer").classList.contains("on")) return;
    if(typing){ finishTyping(); return; }
    advance();
  }, 110);
}

/* ---------- 图鉴 ---------- */
const GAL_ORDER = ["main","midway","echo","leaves","just_rain","farewell","bonus"];
function openGallery(){
  $("gallery").classList.add("on");
  const g = getGallery();
  const grid = $("galGrid");
  grid.innerHTML = "";
  GAL_ORDER.forEach(id=>{
    const e = ENDINGS[id];
    const got = !!g[id];
    const card = document.createElement("div");
    card.className = "gCard " + (got ? "unlocked" : "locked");
    card.innerHTML = got
      ? "<div class='gI'>" + e.icon + "</div><div class='gT'>" + e.title + "</div>" +
        "<div class='gSub'>" + e.sub + "</div><div class='gSeal'>「" + e.seal + "」</div>"
      : "<div class='gI'>🔒</div><div class='gT'>？？？</div>" +
        "<div class='gSub'>" + e.sub + "</div><div class='gSeal'>尚未解锁</div>";
    grid.appendChild(card);
  });
  renderGalleryNums();
}

/* ---------- 初始化 ---------- */
$("bg").style.background = SCENES.campus_road.css;
setSprites("none");
toTitle();
</script>
